name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Copy index.html for SPA routes
        run: |
          mkdir -p dist/glossario && cp dist/index.html dist/glossario/index.html
          mkdir -p dist/il-radar && cp dist/index.html dist/il-radar/index.html
          mkdir -p dist/privacy-policy && cp dist/index.html dist/privacy-policy/index.html
          mkdir -p dist/zero-caos && cp dist/index.html dist/zero-caos/index.html
          mkdir -p dist/ai-no-panico && cp dist/index.html dist/ai-no-panico/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
