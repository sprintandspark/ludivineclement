<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flipbook Preview — Il Radar Playbook</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --cream: #FBF4E6;
    --ink: #1F2340;
    --accent: #4F46E5;
    --amber: #F59E0B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .flipbook-app {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1240 / 1748;
    perspective: 2400px;
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(31, 35, 64, 0.18);
    background: #ffffff;
    overflow: hidden;
  }

  .flip {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transform-origin: left center;
    will-change: transform;
  }

  .flip.animating {
    transition: transform 0.85s cubic-bezier(0.45, 0.05, 0.15, 1);
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #ffffff;
  }

  .face.back {
    transform: rotateY(180deg);
  }

  .face img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #ffffff;
    -webkit-user-drag: none;
    user-select: none;
  }

  .spine-shadow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 6px 0 12px -8px rgba(0,0,0,0.25);
    z-index: 3;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
  }

  .nav-btn {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }

  .nav-btn:hover {
    background: #3f3ad1;
    transform: scale(1.06);
  }

  .nav-btn:active {
    transform: scale(0.95);
  }

  .indicator {
    min-width: 64px;
    text-align: center;
    font-weight: 700;
    color: var(--ink);
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: rgba(79, 70, 229, 0.25);
    cursor: pointer;
    border: none;
    padding: 0;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .dot.active {
    background: var(--accent);
    transform: scale(1.25);
  }

  @media (max-width: 420px) {
    .nav-btn { width: 38px; height: 38px; font-size: 16px; }
    .controls { gap: 14px; }
  }
</style>
</head>
<body>

  <div class="flipbook-app">
    <div class="stage" id="stage">
      <div class="flip" id="flip">
        <div class="face front">
          <img id="frontImg" src="" alt="" />
        </div>
        <div class="face back">
          <img id="backImg" src="" alt="" />
        </div>
      </div>
      <div class="spine-shadow"></div>
    </div>

    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="Pagina precedente">&#10094;</button>
      <span class="indicator" id="indicator">1 / 7</span>
      <button class="nav-btn" id="nextBtn" aria-label="Pagina successiva">&#10095;</button>
    </div>

    <div class="dots" id="dots"></div>
  </div>

<script>
(function () {
  // --- Page list, in final order ---------------------------------
  var pages = [
    { src: "/flipbook/Cover.png", alt: "Copertina", missing: false },
    { src: "/flipbook/Indice.png", alt: "Indice", missing: false },
    { src: "/flipbook/Sprint_Information.png", alt: "Sprint Information", missing: false },
    { src: "/flipbook/02___Chi_sei.png", alt: "02 — Chi sei", missing: false },
    { src: "/flipbook/03a___La_Diagnosi.png", alt: "03a — La Diagnosi", missing: false },
    { src: "/flipbook/04b___Il_tuo_cliente_ideale_-_Come_comunicare.png", alt: "04b — Come comunicare", missing: false },
    { src: "/flipbook/05a___Il_tuo_messaggio.png", alt: "05a — Il tuo messaggio", missing: false }
  ];

  function placeholderSrc(label) {
    var w = 1240, h = 1748;
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
      '<rect width="100%" height="100%" fill="#FBF4E6"/>' +
      '<rect x="28" y="28" width="' + (w - 56) + '" height="' + (h - 56) + '" fill="none" stroke="#4F46E5" stroke-width="4" stroke-dasharray="16 12" rx="18"/>' +
      '<text x="50%" y="46%" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#4F46E5" text-anchor="middle">' + label + '</text>' +
      '<text x="50%" y="53%" font-family="Arial, sans-serif" font-size="30" fill="#8b8fa3" text-anchor="middle">immagine in arrivo</text>' +
      '</svg>';
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  function resolveSrc(i) {
    var p = pages[i];
    return p.missing ? placeholderSrc(p.alt) : p.src;
  }

  var total = pages.length;
  var current = 0;
  var isAnimating = false;
  var autoplayMs = 3000;
  var timer = null;

  var flip = document.getElementById("flip");
  var frontImg = document.getElementById("frontImg");
  var backImg = document.getElementById("backImg");
  var backFace = flip.querySelector(".face.back");
  var indicator = document.getElementById("indicator");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var dotsWrap = document.getElementById("dots");
  var stage = document.getElementById("stage");

  // Build dot indicators
  pages.forEach(function (_, i) {
    var d = document.createElement("button");
    d.className = "dot" + (i === 0 ? " active" : "");
    d.setAttribute("aria-label", "Vai a pagina " + (i + 1));
    d.addEventListener("click", function () {
      goTo(i);
      restartAutoplay();
    });
    dotsWrap.appendChild(d);
  });
  var dots = Array.prototype.slice.call(dotsWrap.children);

  function updateIndicator() {
    indicator.textContent = (current + 1) + " / " + total;
    dots.forEach(function (d, i) {
      d.classList.toggle("active", i === current);
    });
  }

  frontImg.src = resolveSrc(current);
  frontImg.alt = pages[current].alt;
  updateIndicator();

  function turn(direction) {
    if (isAnimating || total < 2) return;
    isAnimating = true;

    var nextIndex = (current + direction + total) % total;

    backImg.src = resolveSrc(nextIndex);
    backImg.alt = pages[nextIndex].alt;
    backFace.style.transform = direction === 1 ? "rotateY(180deg)" : "rotateY(-180deg)";

    // force reflow so the transition class applies cleanly
    void flip.offsetWidth;
    flip.classList.add("animating");
    flip.style.transform = direction === 1 ? "rotateY(-180deg)" : "rotateY(180deg)";

    var onEnd = function () {
      flip.removeEventListener("transitionend", onEnd);
      flip.classList.remove("animating");
      flip.style.transform = "rotateY(0deg)";
      current = nextIndex;
      frontImg.src = resolveSrc(current);
      frontImg.alt = pages[current].alt;
      backFace.style.transform = "rotateY(180deg)";
      updateIndicator();
      isAnimating = false;
    };
    flip.addEventListener("transitionend", onEnd);
  }

  function goTo(index) {
    if (index === current) return;
    var direction = index > current ? 1 : -1;
    // For simplicity with the flip mechanic, jump directly via a single turn
    // toward the requested page (multi-step book placeholder for now).
    var next = (current + direction + total) % total;
    if (next === index) {
      turn(direction);
    } else {
      current = index;
      frontImg.src = resolveSrc(current);
      frontImg.alt = pages[current].alt;
      updateIndicator();
    }
  }

  function next() { turn(1); }
  function prev() { turn(-1); }

  prevBtn.addEventListener("click", function () { prev(); restartAutoplay(); });
  nextBtn.addEventListener("click", function () { next(); restartAutoplay(); });

  function startAutoplay() {
    timer = setInterval(next, autoplayMs);
  }
  function stopAutoplay() {
    clearInterval(timer);
  }
  function restartAutoplay() {
    stopAutoplay();
    startAutoplay();
  }

  stage.addEventListener("mouseenter", stopAutoplay);
  stage.addEventListener("mouseleave", startAutoplay);

  startAutoplay();
})();
</script>

</body>
</html>
