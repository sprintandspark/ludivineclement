<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flipbook Preview — Il Radar Playbook</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --cream: #FBF4E6;
    --ink: #1F2340;
    --accent: #4F46E5;
    --amber: #F59E0B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .flipbook-app {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1240 / 1748;
    perspective: 1200px;
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(31, 35, 64, 0.18);
    background: #ffffff;
    overflow: hidden;
  }

  .page-layer {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #ffffff;
  }

  .page-layer.bottom {
    z-index: 1;
    transform: rotateY(0deg);
  }

  .page-layer.top {
    z-index: 2;
    transform-origin: left center;
    transform: rotateY(0deg) scaleX(1);
  }

  .page-layer.top.turning-next {
    animation: flipNext 600ms ease-in-out forwards;
  }

  .page-layer.top.turning-prev {
    animation: flipPrev 600ms ease-in-out forwards;
  }

  @keyframes flipNext {
    0%   { transform: rotateY(0deg) scaleX(1); }
    50%  { transform: rotateY(-90deg) scaleX(0.78); }
    100% { transform: rotateY(-180deg) scaleX(1); }
  }

  @keyframes flipPrev {
    0%   { transform: rotateY(-180deg) scaleX(1); }
    50%  { transform: rotateY(-90deg) scaleX(0.78); }
    100% { transform: rotateY(0deg) scaleX(1); }
  }

  .page-layer img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #ffffff;
    -webkit-user-drag: none;
    user-select: none;
  }

  .spine-shadow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 6px 0 12px -8px rgba(0,0,0,0.25);
    z-index: 3;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
  }

  .nav-btn {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }

  .nav-btn:hover {
    background: #3f3ad1;
    transform: scale(1.06);
  }

  .nav-btn:active {
    transform: scale(0.95);
  }

  .indicator {
    min-width: 64px;
    text-align: center;
    font-weight: 700;
    color: var(--ink);
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: rgba(79, 70, 229, 0.25);
    cursor: pointer;
    border: none;
    padding: 0;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .dot.active {
    background: var(--accent);
    transform: scale(1.25);
  }

  @media (max-width: 420px) {
    .nav-btn { width: 38px; height: 38px; font-size: 16px; }
    .controls { gap: 14px; }
  }
</style>
</head>
<body>

  <div class="flipbook-app">
    <div class="stage" id="stage">
      <div class="page-layer bottom">
        <img id="bottomImg" src="" alt="" />
      </div>
      <div class="page-layer top" id="topLayer">
        <img id="topImg" src="" alt="" />
      </div>
      <div class="spine-shadow"></div>
    </div>

    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="Pagina precedente">&#10094;</button>
      <span class="indicator" id="indicator">1 / 7</span>
      <button class="nav-btn" id="nextBtn" aria-label="Pagina successiva">&#10095;</button>
    </div>

    <div class="dots" id="dots"></div>
  </div>

<script>
(function () {
  // --- Page list, in final order ---------------------------------
  var pages = [
    { src: "/flipbook/Cover.png", alt: "Copertina", missing: false },
    { src: "/flipbook/Indice.png", alt: "Indice", missing: false },
    { src: "/flipbook/Sprint_Information.png", alt: "Sprint Information", missing: false },
    { src: "/flipbook/02___Chi_sei.png", alt: "02 — Chi sei", missing: false },
    { src: "/flipbook/03a___La_Diagnosi.png", alt: "03a — La Diagnosi", missing: false },
    { src: "/flipbook/04b___Il_tuo_cliente_ideale_-_Come_comunicare.png", alt: "04b — Come comunicare", missing: false },
    { src: "/flipbook/05a___Il_tuo_messaggio.png", alt: "05a — Il tuo messaggio", missing: false }
  ];

  function placeholderSrc(label) {
    var w = 1240, h = 1748;
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
      '<rect width="100%" height="100%" fill="#FBF4E6"/>' +
      '<rect x="28" y="28" width="' + (w - 56) + '" height="' + (h - 56) + '" fill="none" stroke="#4F46E5" stroke-width="4" stroke-dasharray="16 12" rx="18"/>' +
      '<text x="50%" y="46%" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#4F46E5" text-anchor="middle">' + label + '</text>' +
      '<text x="50%" y="53%" font-family="Arial, sans-serif" font-size="30" fill="#8b8fa3" text-anchor="middle">immagine in arrivo</text>' +
      '</svg>';
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  function resolveSrc(i) {
    var p = pages[i];
    return p.missing ? placeholderSrc(p.alt) : p.src;
  }

  var total = pages.length;
  var current = 0;
  var isAnimating = false;
  var autoplayMs = 3000;
  var timer = null;

  var topLayer = document.getElementById("topLayer");
  var topImg = document.getElementById("topImg");
  var bottomImg = document.getElementById("bottomImg");
  var indicator = document.getElementById("indicator");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var dotsWrap = document.getElementById("dots");
  var stage = document.getElementById("stage");

  // Build dot indicators
  pages.forEach(function (_, i) {
    var d = document.createElement("button");
    d.className = "dot" + (i === 0 ? " active" : "");
    d.setAttribute("aria-label", "Vai a pagina " + (i + 1));
    d.addEventListener("click", function () {
      goTo(i);
      restartAutoplay();
    });
    dotsWrap.appendChild(d);
  });
  var dots = Array.prototype.slice.call(dotsWrap.children);

  function updateIndicator() {
    indicator.textContent = (current + 1) + " / " + total;
    dots.forEach(function (d, i) {
      d.classList.toggle("active", i === current);
    });
  }

  topImg.src = resolveSrc(current);
  topImg.alt = pages[current].alt;
  bottomImg.src = resolveSrc(current);
  bottomImg.alt = pages[current].alt;
  updateIndicator();

  function turn(direction) {
    if (isAnimating || total < 2) return;
    isAnimating = true;

    var targetIndex = (current + direction + total) % total;

    if (direction === 1) {
      // Next: the incoming page sits underneath (z-index below) the
      // outgoing page BEFORE the animation starts, so it's visible the
      // instant the top page rotates past 90deg.
      bottomImg.src = resolveSrc(targetIndex);
      bottomImg.alt = pages[targetIndex].alt;

      void topLayer.offsetWidth; // reflow
      topLayer.classList.add("turning-next");
    } else {
      // Previous: the top page starts pre-rotated out of view (-180deg,
      // hidden via backface-visibility) already showing the incoming
      // page, then curls back into view over the current page.
      topLayer.style.transition = "none";
      topLayer.style.animation = "none";
      topLayer.style.transform = "rotateY(-180deg) scaleX(1)";
      topImg.src = resolveSrc(targetIndex);
      topImg.alt = pages[targetIndex].alt;

      void topLayer.offsetWidth; // reflow
      topLayer.style.animation = "";
      topLayer.classList.add("turning-prev");
    }

    var onEnd = function () {
      topLayer.removeEventListener("animationend", onEnd);
      topLayer.classList.remove("turning-next", "turning-prev");
      topLayer.style.transition = "";
      topLayer.style.transform = "rotateY(0deg) scaleX(1)";
      current = targetIndex;
      topImg.src = resolveSrc(current);
      topImg.alt = pages[current].alt;
      bottomImg.src = resolveSrc(current);
      bottomImg.alt = pages[current].alt;
      updateIndicator();
      isAnimating = false;
    };
    topLayer.addEventListener("animationend", onEnd);
  }

  function goTo(index) {
    if (index === current || isAnimating) return;
    var forwardStep = (current + 1) % total;
    var backwardStep = (current - 1 + total) % total;
    if (index === forwardStep) {
      turn(1);
    } else if (index === backwardStep) {
      turn(-1);
    } else {
      // Non-adjacent jump: no curl, just switch directly.
      current = index;
      topImg.src = resolveSrc(current);
      topImg.alt = pages[current].alt;
      bottomImg.src = resolveSrc(current);
      bottomImg.alt = pages[current].alt;
      updateIndicator();
    }
  }

  function next() { turn(1); }
  function prev() { turn(-1); }

  prevBtn.addEventListener("click", function () { prev(); restartAutoplay(); });
  nextBtn.addEventListener("click", function () { next(); restartAutoplay(); });

  function startAutoplay() {
    timer = setInterval(next, autoplayMs);
  }
  function stopAutoplay() {
    clearInterval(timer);
  }
  function restartAutoplay() {
    stopAutoplay();
    startAutoplay();
  }

  stage.addEventListener("mouseenter", stopAutoplay);
  stage.addEventListener("mouseleave", startAutoplay);

  startAutoplay();
})();
</script>

</body>
</html>
